[project]
name = "MetroSnack Financial App"
version = "1.0.0"
description = "MetroSnack Finance Management"
requires-python = ">=3.10"


[tool.flet]
org = "com.metrosnack"
product = "MetroSnack Finance Management"
company = "MetroSnack"

[tool.flet.app]
path = "."
exclude = [
    "venv",
    "Output",
    ".idea",
    ".flet",
    "__pycache__",
    "test_login.py",
    "setup.iss",
    ".prettierrc",
    ".env.example",
]

[tool.flet.android]
target_arch = ["arm64-v8a"]

[tool.flet.android.gradle_properties]
"android.builtInKotlin" = "false"
"android.newDsl" = "false"